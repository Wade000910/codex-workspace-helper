name: Bug report
description: Report a reproducible defect.
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private workspace content, or personal machine paths.
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: 0.1.0, Windows 11, Node.js 22
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include a minimal example and the observed error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
